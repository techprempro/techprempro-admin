name: BuildTechPremProAdminAPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SetUpJDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SetUpGradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: BuildDebugAPK
        working-directory: admin_src/TechPremProAdmin
        run: gradle assembleDebug --stacktrace

      - name: UploadAPK
        uses: actions/upload-artifact@v4
        with:
          name: TechPremPro-Admin-LoginFix-APK
          path: admin_src/TechPremProAdmin/app/build/outputs/apk/debug/*.apk
