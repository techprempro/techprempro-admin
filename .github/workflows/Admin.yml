name: BuildTechPremProAdminAPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ExtractProject
        run: |
          unzip -q TechPremPro_Admin_LoginFix.zip -d buildsrc
          ls -la buildsrc/admin_src/TechPremProAdmin
          find buildsrc/admin_src/TechPremProAdmin -maxdepth 3 -type f

      - name: SetupJDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: GenerateWrapper
        working-directory: buildsrc/admin_src/TechPremProAdmin
        run: gradle wrapper --gradle-version 8.9

      - name: BuildAPK
        working-directory: buildsrc/admin_src/TechPremProAdmin
        run: ./gradlew assembleDebug --stacktrace

      - name: UploadAPK
        uses: actions/upload-artifact@v4
        with:
          name: TechPremPro-Admin-LoginFix-APK
          path: buildsrc/admin_src/TechPremProAdmin/app/build/outputs/apk/debug/*.apk
