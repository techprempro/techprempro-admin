name: BuildTechPremProAdminAPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ExtractProject
        run: |
          unzip -q TechPremPro_Admin_LoginFix.zip -d buildsrc
          ls -la buildsrc/admin_src/TechPremProAdmin

      - name: SetupJDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: FixJvmTargets
        working-directory: buildsrc/admin_src/TechPremProAdmin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace("android { namespace = \"com.techprempro.techpremproadmin\"; compileSdk = 35","android { namespace = \"com.techprempro.techpremproadmin\"; compileSdk = 35\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }")
          p.write_text(s)
          PY

      - name: GenerateWrapper
        working-directory: buildsrc/admin_src/TechPremProAdmin
        run: gradle wrapper --gradle-version 8.9

      - name: BuildAPK
        working-directory: buildsrc/admin_src/TechPremProAdmin
        run: ./gradlew assembleDebug --stacktrace

      - name: UploadAPK
        uses: actions/upload-artifact@v4
        with:
          name: TechPremPro-Admin-LoginFix-APK
          path: buildsrc/admin_src/TechPremProAdmin/app/build/outputs/apk/debug/*.apk
